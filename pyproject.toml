[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning"
version = "0.1.0"
description = "Three weeks of hands-on Python: wordcount CLI -> OOP library -> todo app"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["w1_wordcount*", "w2_library*", "w3_todo*"]

[tool.pytest.ini_options]
testpaths = ["w2_library/tests", "w3_todo/tests"]
pythonpath = ["."]
